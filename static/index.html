<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drone Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #16213e;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #00d4ff;
    }

    header h1 {
      font-size: 1.5rem;
      color: #00d4ff;
      letter-spacing: 2px;
    }

    #stop-btn {
      background: #ff3333;
      color: #fff;
      border: none;
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.15s;
    }
    #stop-btn:hover { background: #cc0000; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 1rem;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* Search bar spans full width */
    #search-bar {
      grid-column: 1 / -1;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    #search-wrap {
      flex: 1;
      min-width: 200px;
    }

    #query-input {
      width: 100%;
      padding: 0.65rem 1rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 2px solid #00d4ff;
      background: #0f3460;
      color: #fff;
      outline: none;
    }
    #query-input:disabled { opacity: 0.5; cursor: not-allowed; }
    #query-input::placeholder { color: #88aacc; }

    #validation-msg {
      color: #ff6666;
      font-size: 0.8rem;
      margin-top: 0.25rem;
      min-height: 1em;
    }

    #search-btn {
      padding: 0.65rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      background: #00d4ff;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #search-btn:hover { background: #00b8db; }
    #search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #searching-indicator {
      display: none;
      align-items: center;
      gap: 0.5rem;
      color: #00d4ff;
      font-size: 0.9rem;
      padding: 0.65rem 0;
    }
    #searching-indicator.active { display: flex; }
    .spinner {
      width: 18px; height: 18px;
      border: 3px solid #00d4ff44;
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Video panel */
    #video-panel {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video-feed {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #detection-badge {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 212, 255, 0.85);
      color: #1a1a2e;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    #detection-badge.visible { display: block; }

    /* Status log */
    #log-panel {
      background: #0f0f23;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #log-header {
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #88aacc;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }

    #log-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.75rem;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      line-height: 1.5;
      min-height: 200px;
      max-height: 400px;
    }

    .log-line { padding: 1px 0; word-break: break-word; }
    .log-line.error { color: #ff6666; }

    /* Result card */
    #result-card {
      display: none;
      grid-column: 1 / -1;
      background: #16213e;
      border: 2px solid #00d4ff;
      border-radius: 10px;
      padding: 1.5rem;
      text-align: center;
    }
    #result-card.visible { display: block; }

    #result-heading {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    #result-heading.found { color: #00d4ff; }
    #result-heading.not-found { color: #ff6666; }

    #result-photo {
      max-width: 320px;
      max-height: 240px;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }
    #result-photo.visible { display: inline-block; }

    #result-description {
      font-size: 1rem;
      color: #ccc;
      margin-bottom: 1.2rem;
    }

    #search-again-btn {
      background: transparent;
      border: 2px solid #00d4ff;
      color: #00d4ff;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    #search-again-btn:hover { background: #00d4ff22; }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>🚁 DRONE FINDER</h1>
  <button id="stop-btn" onclick="doStop()">■ STOP</button>
</header>

<main>
  <!-- Search bar -->
  <div id="search-bar">
    <div id="search-wrap">
      <input
        id="query-input"
        type="text"
        maxlength="200"
        placeholder="What are you looking for? e.g. blue water bottle"
        oninput="clearValidation()"
        onkeydown="if(event.key==='Enter') doSearch()"
      />
      <div id="validation-msg"></div>
    </div>
    <button id="search-btn" onclick="doSearch()">🔍 Search</button>
    <div id="searching-indicator">
      <div class="spinner"></div>
      <span>Searching…</span>
    </div>
  </div>

  <!-- Video panel -->
  <div id="video-panel">
    <img id="video-feed" src="/video" alt="Live drone feed" />
    <div id="detection-badge">🔍 Detecting…</div>
  </div>

  <!-- Status log -->
  <div id="log-panel">
    <div id="log-header">Status Log</div>
    <div id="log-body"></div>
  </div>

  <!-- Result card (hidden until result arrives) -->
  <div id="result-card">
    <div id="result-heading"></div>
    <img id="result-photo" alt="Found item" />
    <p id="result-description"></p>
    <button id="search-again-btn" onclick="resetUI()">Search Again</button>
  </div>
</main>

<script>
  // -----------------------------------------------------------------------
  // State
  // -----------------------------------------------------------------------
  let isSearching = false;
  let userScrolledUp = false;
  let detectionTimeout = null;

  // -----------------------------------------------------------------------
  // WebSocket
  // -----------------------------------------------------------------------
  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let ws;

  function connectWS() {
    ws = new WebSocket(`${wsProto}//${location.host}/ws`);

    ws.onmessage = (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }
      handleMessage(msg);
    };

    ws.onclose = () => {
      // Reconnect after 2 s
      setTimeout(connectWS, 2000);
    };
  }

  function handleMessage(msg) {
    switch (msg.type) {
      case 'status':
        appendLog(msg.payload.message, false);
        break;
      case 'error':
        appendLog(msg.payload.message, true);
        break;
      case 'detection':
        showDetectionBadge();
        break;
      case 'result':
        handleResult(msg.payload);
        break;
    }
  }

  // -----------------------------------------------------------------------
  // Log
  // -----------------------------------------------------------------------
  const logBody = document.getElementById('log-body');

  function appendLog(text, isError) {
    const line = document.createElement('div');
    line.className = 'log-line' + (isError ? ' error' : '');
    line.textContent = text;
    logBody.appendChild(line);

    // Trim to 200 entries
    while (logBody.children.length > 200) {
      logBody.removeChild(logBody.firstChild);
    }

    // Auto-scroll unless user scrolled up
    if (!userScrolledUp) {
      logBody.scrollTop = logBody.scrollHeight;
    }
  }

  logBody.addEventListener('scroll', () => {
    const atBottom = logBody.scrollHeight - logBody.scrollTop <= logBody.clientHeight + 4;
    userScrolledUp = !atBottom;
  });

  // -----------------------------------------------------------------------
  // Detection badge
  // -----------------------------------------------------------------------
  function showDetectionBadge() {
    const badge = document.getElementById('detection-badge');
    badge.classList.add('visible');
    clearTimeout(detectionTimeout);
    detectionTimeout = setTimeout(() => badge.classList.remove('visible'), 3000);
  }

  // -----------------------------------------------------------------------
  // Search
  // -----------------------------------------------------------------------
  async function doSearch() {
    const input = document.getElementById('query-input');
    const query = input.value.trim();
    if (!query) {
      document.getElementById('validation-msg').textContent = 'Please enter what you are looking for.';
      return;
    }

    setSearching(true);
    hideResultCard();

    try {
      const resp = await fetch('/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });
      if (!resp.ok) {
        const data = await resp.json();
        document.getElementById('validation-msg').textContent = data.error || 'Search failed.';
        setSearching(false);
      }
    } catch (e) {
      document.getElementById('validation-msg').textContent = 'Could not reach the server.';
      setSearching(false);
    }
  }

  async function doStop() {
    try {
      await fetch('/stop', { method: 'POST' });
    } catch (e) {
      appendLog('[ERROR] Could not send stop command.', true);
    }
    setSearching(false);
  }

  function clearValidation() {
    document.getElementById('validation-msg').textContent = '';
  }

  function setSearching(on) {
    isSearching = on;
    document.getElementById('query-input').disabled = on;
    document.getElementById('search-btn').disabled = on;
    document.getElementById('searching-indicator').classList.toggle('active', on);
  }

  // -----------------------------------------------------------------------
  // Result card
  // -----------------------------------------------------------------------
  function handleResult(payload) {
    setSearching(false);
    document.getElementById('detection-badge').classList.remove('visible');

    const card = document.getElementById('result-card');
    const heading = document.getElementById('result-heading');
    const photo = document.getElementById('result-photo');
    const desc = document.getElementById('result-description');

    if (payload.found) {
      heading.textContent = 'Found it! 🎯';
      heading.className = 'found';
      desc.textContent = payload.description || '';

      if (payload.photo) {
        photo.src = 'data:image/jpeg;base64,' + payload.photo;
        photo.classList.add('visible');
      } else {
        photo.classList.remove('visible');
      }
    } else {
      heading.textContent = 'Not found 😔';
      heading.className = 'not-found';
      desc.textContent = payload.message || 'The drone completed the full sweep without finding the item.';
      photo.classList.remove('visible');
    }

    card.classList.add('visible');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function hideResultCard() {
    document.getElementById('result-card').classList.remove('visible');
    document.getElementById('result-photo').classList.remove('visible');
  }

  function resetUI() {
    hideResultCard();
    document.getElementById('query-input').value = '';
    clearValidation();
    setSearching(false);
  }

  // -----------------------------------------------------------------------
  // Boot
  // -----------------------------------------------------------------------
  connectWS();
</script>

</body>
</html>
